<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만수중학교 홈페이지</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="logo">🏫 만수중학교</div>
  <nav class="site-nav">
    <a href="index.html" class="active">홈</a>
    <a href="about.html">학교소개</a>
    <a href="facilities.html">시설안내</a>
    <a href="meal.html">급식</a>
  </nav>
</header>

<main>
  <section class="school-banner">
    <h1>만수중학교</h1>
    <div class="info-grid">
      <div>설립구분: 공립 &nbsp; 설립유형: 단설</div>
      <div>설립일자: 1984년 03월 02일</div>
      <div>대표번호: 032-467-1833-6</div>
      <div>주소: 인천광역시 남동구 인수로 13</div>
      <div>학생수: 184명 (남 184명, 여 0명)</div>
      <div>교원수: 29명 (남 8명, 여 21명)</div>
    </div>
  </section>

  <div class="card-grid">
    <div class="card">
      <h2>오늘의 급식</h2>
      <div id="today-meal-box">
        <div class="meal-empty">불러오는 중...</div>
      </div>
    </div>
    <div class="card">
      <h2>학사일정</h2>
      <p>2026. 06. 29 (월) ~ 2026. 07. 05 (일)</p>
      <p>07. 04 (토) 토요휴업일</p>
    </div>
    <div class="card">
      <h2>바로가기</h2>
      <p><a href="meal.html">📅 이번달 급식 전체보기</a></p>
      <p><a href="facilities.html">🏛 학교 시설 둘러보기</a></p>
      <p><a href="about.html">ℹ️ 학교 소개</a></p>
    </div>
  </div>
</main>

<footer>© 2026 만수중학교</footer>

<script src="data/meals.js"></script>
<script>
  (function () {
    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);
    const box = document.getElementById("today-meal-box");
    const menu = getMealsForDate(todayStr);
    if (menu) {
      box.innerHTML =
        `<div class="today-meal-date">${todayStr}</div>` +
        `<ul class="meal-list">${menu.map((m) => `<li>${m}</li>`).join("")}</ul>`;
    } else {
      box.innerHTML = `<div class="meal-empty">오늘은 급식 정보가 없습니다.</div>`;
    }
  })();
</script>
</body>
</html>
