services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      TYPE: "VANILLA"
      MEMORY: "${MEMORY:-2G}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MODE: "${MODE:-survival}"
      MOTD: "${MOTD:-A Minecraft Server}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
    volumes:
      - ./data:/data
