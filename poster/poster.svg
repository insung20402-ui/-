      <stop offset="45%" stop-color="#ffce5c" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36e2c9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#36e2c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a4dff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8a4dff" stop-opacity="0"/>
