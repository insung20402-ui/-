      <stop offset="0%" stop-color="#0b0620"/>
      <stop offset="35%" stop-color="#3a0f5e"/>
      <stop offset="60%" stop-color="#a31f5c"/>
      <stop offset="80%" stop-color="#e0552f"/>
      <stop offset="100%" stop-color="#ffc24b"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
