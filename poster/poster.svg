    <rect x="106" y="1110" width="6" height="9"/><rect x="120" y="1140" width="6" height="9"/>
    <rect x="156" y="980" width="6" height="9"/><rect x="174" y="1010" width="6" height="9"/><rect x="156" y="1040" width="6" height="9"/><rect x="174" y="1070" width="6" height="9"/>
