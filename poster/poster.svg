  <text x="642" y="1805" text-anchor="middle" fill="#ffd86b" font-size="24" opacity="0.9" letter-spacing="1">#인천과학대제전 #STEAM #제28회 #THE28thINCHEONSCIENCEFESTIVAL</text>
