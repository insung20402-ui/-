<svg xmlns="http://www.w3.org/2000/svg" width="257mm" height="364mm" viewBox="0 0 1285 1820" font-family="Noto Sans CJK KR, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0620"/>
      <stop offset="35%" stop-color="#3a0f5e"/>
      <stop offset="60%" stop-color="#a31f5c"/>
      <stop offset="80%" stop-color="#e0552f"/>
      <stop offset="100%" stop-color="#ffc24b"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="45%" stop-color="#ffce5c" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36e2c9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#36e2c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a4dff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8a4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff2c4"/>
      <stop offset="50%" stop-color="#ffd86b"/>
      <stop offset="100%" stop-color="#fff2c4"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1285" height="1820" fill="url(#bg)"/>

  <!-- nebula clouds -->
  <circle cx="180" cy="1000" r="420" fill="url(#nebulaPink)"/>
  <circle cx="1150" cy="1250" r="380" fill="url(#nebulaTeal)"/>
  <circle cx="1000" cy="1500" r="350" fill="url(#nebulaPurple)"/>
  <circle cx="100" cy="300" r="300" fill="url(#nebulaPurple)" opacity="0.6"/>

  <!-- sun / atom core glow -->
  <circle cx="950" cy="420" r="480" fill="url(#sun)"/>

  <!-- multi-layer star field -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="3"/><circle cx="220" cy="260" r="2"/><circle cx="80" cy="340" r="2.5"/>
    <circle cx="300" cy="120" r="2"/><circle cx="1120" cy="180" r="2"/><circle cx="1190" cy="300" r="3"/>
    <circle cx="60" cy="600" r="2"/><circle cx="1200" cy="620" r="2.5"/><circle cx="40" cy="900" r="2"/>
    <circle cx="1230" cy="950" r="2"/><circle cx="500" cy="90" r="2"/><circle cx="700" cy="150" r="2.5"/>
    <circle cx="850" cy="60" r="2"/><circle cx="150" cy="480" r="2"/><circle cx="1080" cy="480" r="2"/>
    <circle cx="970" cy="140" r="2"/><circle cx="420" cy="220" r="1.8"/><circle cx="1260" cy="120" r="2"/>
    <circle cx="30" cy="200" r="1.8"/><circle cx="640" cy="40" r="2"/><circle cx="1140" cy="60" r="1.8"/>
  </g>
  <g fill="#ffe9a8" filter="url(#glow)">
    <circle cx="200" cy="180" r="3.5"/><circle cx="1100" cy="240" r="3.5"/>
    <circle cx="60" cy="520" r="3"/><circle cx="1220" cy="500" r="3.5"/>
  </g>

  <!-- shooting stars / comets -->
  <g stroke="#ffe9a8" stroke-linecap="round" opacity="0.85">
    <line x1="980" y1="80" x2="1100" y2="140" stroke-width="3"/>
    <line x1="180" y1="220" x2="280" y2="270" stroke-width="2.5"/>
    <line x1="1050" y1="700" x2="1150" y2="745" stroke-width="2.5"/>
  </g>

  <!-- abstract skyline rising into horizon -->
  <path d="M0 1180 L150 1020 L260 1110 L380 950 L520 1080 L650 960 L800 1100 L930 990 L1060 1090 L1180 1000 L1285 1100 L1285 1820 L0 1820 Z" fill="#2a1140" opacity="0.85"/>
  <path d="M0 1280 L180 1160 L340 1240 L500 1120 L680 1230 L860 1130 L1040 1230 L1285 1140 L1285 1820 L0 1820 Z" fill="#190a2c"/>
  <!-- antenna spires -->
  <g stroke="#190a2c" stroke-width="4">
    <line x1="380" y1="950" x2="380" y2="900"/><circle cx="380" cy="896" r="4" fill="#ffe9a8" stroke="none"/>
    <line x1="930" y1="990" x2="930" y2="945"/><circle cx="930" cy="941" r="4" fill="#ffe9a8" stroke="none"/>
  </g>
  <!-- skyline window lights -->
  <g fill="#ffe9a8" opacity="0.7">
    <rect x="160" y="1080" width="6" height="10"/><rect x="180" y="1100" width="6" height="10"/>
    <rect x="400" y="1010" width="6" height="10"/><rect x="700" y="1020" width="6" height="10"/>
    <rect x="950" y="1050" width="6" height="10"/><rect x="1100" y="1060" width="6" height="10"/>
    <rect x="240" y="1130" width="6" height="10"/><rect x="460" y="1060" width="6" height="10"/>
    <rect x="600" y="1010" width="6" height="10"/><rect x="820" y="1130" width="6" height="10"/>
    <rect x="1020" y="1080" width="6" height="10"/><rect x="1200" y="1040" width="6" height="10"/>
  </g>

  <!-- orbit / atom motif -->
  <g transform="translate(950,420)">
    <circle r="335" fill="url(#ringGlow)"/>
    <ellipse rx="335" ry="120" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" transform="rotate(20)"/>
    <ellipse rx="335" ry="120" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.45" transform="rotate(-35)"/>
    <ellipse rx="335" ry="120" fill="none" stroke="#ffe9a8" stroke-width="2" opacity="0.5" transform="rotate(75)"/>
    <circle r="16" fill="#fff6d8" filter="url(#glow)"/>
    <circle cx="290" cy="22" r="9" fill="#ffe9a8" filter="url(#glow)"/>
    <circle cx="-260" cy="-62" r="8" fill="#ffe9a8" filter="url(#glow)"/>
    <circle cx="60" cy="320" r="7" fill="#36e2c9" filter="url(#glow)"/>
  </g>

  <!-- rocket with flame trail -->
  <g transform="translate(245,580) rotate(-25)">
    <path d="M0 60 C-30 130 -10 190 0 230" stroke="#ffce5c" stroke-width="14" fill="none" opacity="0.6" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M0 60 C-15 110 -5 150 0 175" stroke="#fff6d8" stroke-width="7" fill="none" opacity="0.8" stroke-linecap="round"/>
    <path d="M0 -65 C30 -32 30 32 0 65 C-30 32 -30 -32 0 -65 Z" fill="#fff6d8"/>
    <path d="M-13 32 L-44 75 L-9 58 Z" fill="#ffce5c"/>
    <path d="M13 32 L44 75 L9 58 Z" fill="#ffce5c"/>
    <circle cx="0" cy="-16" r="11" fill="#3a0f5e"/>
    <circle cx="0" cy="-16" r="6" fill="#36e2c9"/>
  </g>

  <!-- science icon cluster: flask -->
  <g transform="translate(150,1010) rotate(-8)" stroke="#ffe9a8" stroke-width="4" stroke-linejoin="round">
    <path d="M-10 -45 h20 v22 l20 48 a9 9 0 0 1 -9 12 h-42 a9 9 0 0 1 -9 -12 l20 -48 Z" fill="#ff4fa3" fill-opacity="0.35"/>
    <path d="M-22 0 h44" opacity="0.7"/>
    <circle cx="-6" cy="20" r="3.5" fill="#ffe9a8" stroke="none"/>
    <circle cx="10" cy="32" r="2.5" fill="#36e2c9" stroke="none"/>
    <circle cx="-2" cy="38" r="2" fill="#ffffff" stroke="none"/>
  </g>

  <!-- DNA helix -->
  <g transform="translate(1130,1090)" stroke="#36e2c9" stroke-width="4" fill="none" opacity="0.9">
    <path d="M-16 -45 C16 -22 -16 0 16 22 C-16 44 16 66 -16 88"/>
    <path d="M16 -45 C-16 -22 16 0 -16 22 C16 44 -16 66 16 88"/>
    <circle cx="-16" cy="-45" r="3" fill="#36e2c9" stroke="none"/><circle cx="16" cy="-45" r="3" fill="#36e2c9" stroke="none"/>
    <circle cx="16" cy="22" r="3" fill="#ffe9a8" stroke="none"/><circle cx="-16" cy="22" r="3" fill="#ffe9a8" stroke="none"/>
    <circle cx="-16" cy="88" r="3" fill="#36e2c9" stroke="none"/><circle cx="16" cy="88" r="3" fill="#36e2c9" stroke="none"/>
  </g>

  <!-- satellite -->
  <g transform="translate(1080,260) rotate(30)" stroke="#ffe9a8" stroke-width="3.5" fill="none" opacity="0.9">
    <rect x="-16" y="-10" width="32" height="20" rx="3" fill="#3a0f5e"/>
    <rect x="-46" y="-3" width="26" height="6" fill="#ffe9a8" stroke="none"/>
    <rect x="20" y="-3" width="26" height="6" fill="#ffe9a8" stroke="none"/>
    <line x1="0" y1="10" x2="0" y2="28"/>
    <circle cx="0" cy="32" r="3" fill="#36e2c9" stroke="none"/>
  </g>

  <!-- ringed planet -->
  <g transform="translate(170,260)" opacity="0.9">
    <circle r="26" fill="#8a4dff" opacity="0.85"/>
    <ellipse rx="46" ry="12" fill="none" stroke="#ffe9a8" stroke-width="3" transform="rotate(-18)"/>
  </g>

  <!-- magnifier -->
  <g transform="translate(1180,840) rotate(15)" stroke="#ffe9a8" stroke-width="5" fill="none" opacity="0.85">
    <circle r="26" fill="#36e2c9" fill-opacity="0.2"/>
    <line x1="18" y1="18" x2="42" y2="42"/>
  </g>

  <!-- atom icon -->
  <g transform="translate(110,760)" opacity="0.85">
    <ellipse rx="34" ry="13" fill="none" stroke="#ff4fa3" stroke-width="3" transform="rotate(20)"/>
    <ellipse rx="34" ry="13" fill="none" stroke="#ff4fa3" stroke-width="3" transform="rotate(-40)"/>
    <ellipse rx="34" ry="13" fill="none" stroke="#ff4fa3" stroke-width="3" transform="rotate(80)"/>
    <circle r="6" fill="#fff6d8"/>
  </g>

  <!-- open book -->
  <g transform="translate(1010,860)" stroke="#ffe9a8" stroke-width="3.5" fill="none" opacity="0.85">
    <path d="M0 -16 C-22 -26 -40 -20 -40 -20 V18 C-40 18 -22 12 0 22 C22 12 40 18 40 18 V-20 C40 -20 22 -26 0 -16 Z" fill="#a31f5c" fill-opacity="0.3"/>
    <line x1="0" y1="-16" x2="0" y2="22"/>
  </g>

  <!-- confetti / particle bits scattered -->
  <g opacity="0.85">
    <rect x="330" y="980" width="10" height="10" fill="#ff4fa3" transform="rotate(20 335 985)"/>
    <rect x="960" y="940" width="9" height="9" fill="#36e2c9" transform="rotate(-15 965 945)"/>
    <rect x="780" y="1010" width="8" height="8" fill="#ffe9a8" transform="rotate(35 784 1014)"/>
    <circle cx="420" cy="940" r="5" fill="#8a4dff"/>
    <circle cx="900" cy="1000" r="4" fill="#ff4fa3"/>
    <circle cx="600" cy="1020" r="4.5" fill="#36e2c9"/>
  </g>

  <!-- soft cloud bands behind skyline -->
  <g fill="#ffffff" opacity="0.08">
    <ellipse cx="300" cy="1020" rx="220" ry="40"/>
    <ellipse cx="900" cy="980" rx="260" ry="46"/>
    <ellipse cx="1150" cy="1040" rx="180" ry="34"/>
  </g>

  <!-- decorative corner frame accents -->
  <g stroke="#ffe9a8" stroke-width="3" opacity="0.8" fill="none">
    <path d="M40 40 h70 M40 40 v70"/>
    <path d="M1245 40 h-70 M1245 40 v70"/>
    <path d="M40 1780 h70 M40 1780 v-70"/>
    <path d="M1245 1780 h-70 M1245 1780 v-70"/>
  </g>

  <!-- title block -->
  <text x="642" y="700" text-anchor="middle" fill="url(#goldText)" font-size="34" letter-spacing="5" filter="url(#glow)">THE 28th INCHEON SCIENCE FESTIVAL</text>

  <text x="642" y="795" text-anchor="middle" fill="#ffffff" font-size="98" font-weight="700" filter="url(#glow)">제28회 인천과학대제전</text>

  <rect x="262" y="852" width="760" height="90" rx="14" fill="url(#panel)" stroke="url(#goldText)" stroke-width="2"/>
  <text x="642" y="910" text-anchor="middle" fill="url(#goldText)" font-size="42" font-weight="700">인천을 넘어 세계로, 과학이 여는 미래</text>

  <!-- info panel -->
  <rect x="160" y="1440" width="965" height="300" rx="26" fill="#120726" opacity="0.8" stroke="url(#goldText)" stroke-width="2"/>
  <rect x="160" y="1440" width="965" height="300" rx="26" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25"/>

  <g fill="#ffffff" font-size="33">
    <text x="210" y="1512"><tspan fill="#ffd86b" font-weight="700">기간 </tspan>2026.10.23.(금) ~ 10.24.(토)</text>
    <text x="210" y="1568"><tspan fill="#ffd86b" font-weight="700">장소 </tspan>인천아시아드주경기장</text>
    <text x="210" y="1624"><tspan fill="#ffd86b" font-weight="700">홈페이지 </tspan>인천과학사랑.kr</text>
    <text x="210" y="1680"><tspan fill="#ffd86b" font-weight="700">주최·주관 </tspan>인천광역시교육청</text>
  </g>

  <text x="1075" y="1768" text-anchor="end" fill="#ffffff" font-size="26" opacity="0.85">The 28th Incheon Science Festival</text>
</svg>
