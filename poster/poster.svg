    <line x1="430" y1="985" x2="560" y2="1180"/><line x1="430" y1="1015" x2="520" y2="1180"/><line x1="430" y1="1045" x2="480" y2="1180"/>
    <line x1="900" y1="985" x2="770" y2="1180"/><line x1="900" y1="1015" x2="810" y2="1180"/><line x1="900" y1="1045" x2="850" y2="1180"/>
    <line x1="900" y1="985" x2="1030" y2="1180"/><line x1="900" y1="1015" x2="990" y2="1180"/><line x1="900" y1="1045" x2="950" y2="1180"/>
