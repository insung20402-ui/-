<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로드뷰 · 내 사진</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f7f9; --surface:#fff; --text:#171a1f; --muted:#5c6672; --line:#dde2e8; --accent:#2d7cff; --danger:#d93025; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --surface:#171b21; --text:#e7eaee; --muted:#9aa4b1; --line:#2a313a; --accent:#6aa0ff; --danger:#ff7b72; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { white-space: nowrap; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 38%) 1fr; }
  #mapWrap, #viewWrap { position: relative; min-width: 0; min-height: 0; }
  #map { position: absolute; inset: 0; }
  #view { position: absolute; inset: 0; background: #111; }
  body.full main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  body.full #mapWrap { position: fixed; left: 12px; bottom: 12px; width: 280px; height: 200px; z-index: 500; border: 2px solid var(--surface); border-radius: 12px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .peg { width: 60px; height: 60px; transform-origin: 50% 50%; }
  .peg-icon, .pick-icon { background: none; border: 0; }
  .pick-icon b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #ff5a28; color: #fff; border: 2px solid #fff; font-size: 12px; }
  .cover-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; cursor: pointer; }
  .hud { position: absolute; z-index: 5; background: rgba(20,22,26,.72); color: #fff; border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); font-size: 13px; }
  #info { left: 12px; top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 140px); }
  #info input { width: 64px; padding: 2px 6px; border-radius: 6px; border: 1px solid #556; background: #fff2; color: #fff; }
  #info button { background: #fff2; color: #fff; border-color: #fff4; padding: 2px 8px; }
  #compass { right: 12px; top: 12px; font-variant-numeric: tabular-nums; }
  #controls { right: 12px; bottom: 12px; display: flex; gap: 6px; }
  #controls button { background: #fff2; color: #fff; border-color: #fff4; }
  #empty { position: absolute; inset: 0; display: none; place-items: center; text-align: center; color: #cfd6df; padding: 24px; z-index: 4; }
  #empty div { max-width: 36ch; }
  #empty h2 { color: #fff; font-size: 20px; margin: 0 0 8px; }
  #loading { left: 50%; top: 12px; transform: translateX(-50%); display: none; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #202428; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 2000; display: none; max-width: 90vw; }
  #banner { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 1500; display: none; align-items: center; gap: 12px; background: #ff5a28; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  #banner button { background: #fff3; color: #fff; border-color: #fff6; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(760px, 94vw); background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 18px 20px; }
  .dlg h2 { margin: 0 0 4px; font-size: 18px; }
  .muted { color: var(--muted); }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; margin: 12px 0; }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #rows { max-height: 38vh; overflow: auto; }
  .row { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .row img { width: 56px; height: 42px; object-fit: cover; border-radius: 6px; background: #000; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; font-size: 12px; }
  .row input[type=number] { width: 58px; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--line); }
  .badge.ok { background: #d5f0dc; color: #14632d; } .badge.warn { background: #fde9c7; color: #8a5a00; }
  .foot { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .foot .grow { margin-right: auto; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0 0; padding: 8px 12px; }
  label.r { margin-right: 14px; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 8px; }
  @media (max-width: 760px) { header { padding: 0 8px; gap: 6px; } header button { padding: 6px 8px; font-size: 13px; } main { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; } body.full main { grid-template-columns: 1fr; grid-template-rows: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>로드뷰 · 내 사진</h1>
  <button id="bCoverage" class="on" title="촬영 구간 표시">로드뷰 구간</button>
  <button id="bLayout">전체 화면</button>
  <button id="bAdd" class="primary">사진 추가</button>
</header>
<main>
  <div id="mapWrap"><div id="map"></div></div>
  <div id="viewWrap">
    <div id="view"></div>
    <div id="empty"><div><h2>아직 로드뷰가 없습니다</h2><p>사진을 추가하면 위치(GPS)나 지도에서 고른 위치에 로드뷰가 만들어집니다. 360° 사진이면 그대로 사방을 볼 수 있습니다.</p><button class="primary" id="bAdd2">사진 추가</button></div></div>
    <div id="info" class="hud" hidden></div>
    <div id="compass" class="hud" hidden></div>
    <div id="loading" class="hud">불러오는 중…</div>
    <div id="controls" class="hud" hidden><button id="bFwd" title="앞으로 (↑)">↑ 앞</button><button id="bBack" title="뒤로 (↓)">↓ 뒤</button></div>
  </div>
</main>
<div id="toast"></div>
<div id="banner"><span id="bannerText"></span><button id="bannerCancel">취소</button></div>

<dialog id="dlg"><div class="dlg">
  <h2>사진 추가</h2>
  <div class="muted">GPS가 있는 사진은 그 위치에 자동으로 놓입니다. 없으면 지도에서 위치를 고릅니다.</div>
  <div class="drop" id="drop">여기에 사진을 끌어 놓거나 <button id="bPick">파일 선택</button><input id="file" type="file" accept="image/*" multiple hidden></div>
  <div id="rows"></div>
  <fieldset id="modeBox" hidden>
    <legend>GPS가 없는 사진 <span id="noGpsCount"></span>장은</legend>
    <label class="r"><input type="radio" name="mode" value="spot" checked> 한 지점에서 여러 방향으로 찍음</label>
    <label class="r"><input type="radio" name="mode" value="route"> 이동하며 찍음(시작·끝점을 지도에서 지정, 파일명 순서)</label>
  </fieldset>
  <div class="tip">일반 사진 한 장은 시야 일부만 채웁니다. 한 지점에서 45° 간격으로 8장 이상 찍어 올리면 빈 곳이 거의 없어지고, 360° 카메라 사진이면 완전한 로드뷰가 됩니다.</div>
  <div class="foot"><span class="grow muted" id="sum"></span><button id="dCancel">닫기</button><button id="dOk" class="primary" disabled>등록</button></div>
</div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="../shared/exif.js"></script>
<script src="../shared/reproject.js"></script>
<script src="../shared/graph.js"></script>
<script src="store.js"></script>
<script src="pano.js"></script>
<script src="viewer.js"></script>
<script src="maps.js"></script>
<script src="app.js"></script>
</body>
</html>
