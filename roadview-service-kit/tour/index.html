<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>투어 로드뷰</title>
<link rel="stylesheet" href="tour.css">
</head>
<body>
<div id="rv">
  <img id="a" class="layer" alt=""><img id="b" class="layer" alt="">
  <div id="marker">▲</div>
  <div id="top"><span class="pill">로드뷰</span><span id="place"></span><span class="sp"></span>
    <a class="btn" href="make.html">만들기</a>
    <button class="btn" id="fs">전체화면</button></div>
  <div id="hint"></div>
  <div id="mini"><b>위치 <span id="count"></span></b>
    <div id="path"><div class="line"></div><div class="done" id="done"></div><div id="dot"></div></div>
    <div id="end"><span id="s"></span><span id="e"></span></div></div>
  <div id="tabs"></div>
  <div id="arrows"><button class="arr" id="bck" aria-label="뒤로">▼</button><button class="arr" id="fwd" aria-label="앞으로">▲</button></div>
  <div id="empty"><div><h2>아직 투어가 없습니다</h2><p>영상을 올리면 이동하는 로드뷰나 돌려보는 로드뷰가 만들어집니다.</p><a class="btn big" href="make.html">영상으로 만들기</a></div></div>
</div>
<script src="data.js"></script>
<script src="tour.js"></script>
</body>
</html>
