<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실내 길찾기 - 만수중학교 네비게이션</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="map-page">
    <a href="../index.html" class="back-link">&larr; 홈으로</a>
    <h1>실내 길찾기</h1>

    <div class="route-form">
      <label>출발지
        <select id="from"></select>
      </label>
      <label>목적지
        <select id="to"></select>
      </label>
      <button id="find-route">길찾기</button>
    </div>

    <div id="result" class="route-result"></div>

    <h2>전체 시설 목록</h2>
    <ul id="place-list" class="place-list"></ul>
  </div>

  <script src="../js/map.js"></script>
</body>
</html>
