<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>학교 로드뷰 - 세로</title>
<link rel="stylesheet" href="roadview.css">
</head>
<body class="portrait">
<div id="rv">
  <img id="a" class="layer" alt=""><img id="b" class="layer" alt="">
  <div id="marker">▲</div>
  <div id="top"><span class="pill">로드뷰</span><span id="place"></span><span class="sp"></span>
    <a class="btn" href="landscape.html" style="text-decoration:none">가로 보기</a>
    <button class="btn" id="fs">전체화면</button></div>
  <div id="hint">바닥을 클릭하면 앞으로, 화면 아래쪽을 클릭하면 뒤로 · 드래그로 둘러보기 · 스크롤/방향키 이동</div>
  <div id="mini"><b>위치 <span id="count"></span></b>
    <div id="path"><div class="line"></div><div class="done" id="done"></div><div id="dot"></div></div>
    <div id="end"><span id="s"></span><span id="e"></span></div></div>
  <div id="tabs"></div>
  <div id="arrows"><button class="arr" id="bck" aria-label="뒤로">▼</button><button class="arr" id="fwd" aria-label="앞으로">▲</button></div>
</div>
<script src="tours.js"></script>
<script src="roadview.js"></script>
</body>
</html>
