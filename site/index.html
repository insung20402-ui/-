<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학교 로드뷰</title>
<style>
  :root{--bg:#0f1115;--fg:#f2f4f8;--mut:#9aa3b2;--acc:#7bd13c;--card:#1a1d24}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
  header{display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}
  h1{font-size:17px;margin:0 8px 0 0}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{background:var(--card);color:var(--fg);border:1px solid #2a2f3a;border-radius:999px;padding:6px 12px;cursor:pointer}
  .tabs button.on{background:var(--acc);color:#10210a;border-color:var(--acc);font-weight:600}
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;user-select:none}
  #img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:24px;cursor:pointer}
  #prev{left:12px}#next{right:12px}
  .nav:hover{background:#000d}
  footer{padding:10px 16px 14px;display:flex;gap:12px;align-items:center}
  #seek{flex:1;accent-color:var(--acc)}
  #pos{color:var(--mut);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
  #play{background:var(--card);color:var(--fg);border:1px solid #2a2f3a;border-radius:8px;padding:6px 12px;cursor:pointer}
  .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff9;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<header><h1>학교 로드뷰</h1><div class="tabs" id="tabs"></div></header>
<div id="stage">
  <img id="img" alt="">
  <button class="nav" id="prev" aria-label="뒤로">‹</button>
  <button class="nav" id="next" aria-label="앞으로">›</button>
  <div class="hint">← → 키 · 화면 드래그/스와이프 · 스크롤로 이동</div>
</div>
<footer>
  <button id="play">▶ 자동 걷기</button>
  <input id="seek" type="range" min="0" value="0">
  <span id="pos"></span>
</footer>
<script src="tours.js"></script>
<script>
const $ = id => document.getElementById(id);
let tours = [], tour = null, idx = 0, timer = null;
const src = i => `frames/${tour.id}/${String(i).padStart(3,'0')}.${tour.ext}`;

function show(i){
  idx = Math.max(0, Math.min(tour.count - 1, i));
  $('img').src = src(idx);
  $('seek').value = idx;
  $('pos').textContent = `${idx + 1} / ${tour.count}`;
  for (const d of [1, 2]) if (idx + d < tour.count) new Image().src = src(idx + d);
}
function setTour(t){
  stop(); tour = t; $('seek').max = t.count - 1;
  [...$('tabs').children].forEach((b, k) => b.classList.toggle('on', tours[k] === t));
  show(0);
}
function stop(){ clearInterval(timer); timer = null; $('play').textContent = '▶ 자동 걷기'; }
function play(){
  if (timer) return stop();
  if (idx >= tour.count - 1) show(0);
  $('play').textContent = '⏸ 멈춤';
  timer = setInterval(() => idx >= tour.count - 1 ? stop() : show(idx + 1), 500);
}
$('next').onclick = () => { stop(); show(idx + 1); };
$('prev').onclick = () => { stop(); show(idx - 1); };
$('play').onclick = play;
$('seek').oninput = e => { stop(); show(+e.target.value); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { stop(); show(idx + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { stop(); show(idx - 1); }
  if (e.key === ' ') { e.preventDefault(); play(); }
});
let wheelAcc = 0;
$('stage').addEventListener('wheel', e => {
  e.preventDefault(); wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) > 60) { stop(); show(idx + (wheelAcc > 0 ? 1 : -1)); wheelAcc = 0; }
}, { passive: false });
let dragX = null, dragIdx = 0;
$('stage').addEventListener('pointerdown', e => { dragX = e.clientX; dragIdx = idx; });
addEventListener('pointerup', () => dragX = null);
addEventListener('pointermove', e => {
  if (dragX === null) return;
  stop(); show(dragIdx + Math.round((dragX - e.clientX) / 40));
});

function init(d){
  tours = d.tours;
  tours.forEach(t => {
    const b = document.createElement('button'); b.textContent = t.title;
    b.onclick = () => setTour(t); $('tabs').appendChild(b);
  });
  setTour(tours[0]);
}
if (window.TOURS) init(window.TOURS); else fetch('tours.json').then(r => r.json()).then(init);
</script>
</body>
</html>
